# weather-store: MODE=store. gRPC on 9090, small REST surface on 9091.
# The only workload allowed to talk to Postgres and Redis directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weather.fullname" . }}-store
  labels:
    {{- include "weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: store
spec:
  replicas: {{ .Values.app.replicas.store }}
  selector:
    matchLabels:
      {{- include "weather.selector" . | nindent 6 }}
      app.kubernetes.io/component: store
  template:
    metadata:
      labels:
        {{- include "weather.labels" . | nindent 8 }}
        app.kubernetes.io/component: store
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: store
          image: "{{ include "weather.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MODE
              value: store
          envFrom:
            - configMapRef:
                name: {{ include "weather.fullname" . }}-env
            - secretRef:
                name: {{ include "weather.fullname" . }}-secrets
          ports:
            - name: grpc
              containerPort: 9090
            - name: http
              containerPort: 9091
          # store retries Postgres for up to 60s and only then starts
          # serving HTTP, so give startup its own budget.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "weather.fullname" . }}-store
  labels:
    {{- include "weather.labels" . | nindent 4 }}
    app.kubernetes.io/component: store
spec:
  type: ClusterIP
  selector:
    {{- include "weather.selector" . | nindent 4 }}
    app.kubernetes.io/component: store
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: http
      port: 9091
      targetPort: http
